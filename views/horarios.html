<div class="page-head">
  <div><h1>Horarios</h1><p>Materias y horas de cada grupo. Escribe el grupo para ver su horario</p></div>
  <button class="btn btn-primary" id="btn-add">Agregar horario</button>
</div>

<form id="form-buscar" class="buscar-grupo">

  <datalist id="grupos-list"></datalist>
  <button class="btn btn-primary">Ver horario</button>
</form>

<div id="horario-result"></div>
